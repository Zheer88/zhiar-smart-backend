<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Zhiar Smart - پەخشی کەناڵەکان</title>
  <meta name="referrer" content="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; gap: 20px; height: 90vh; }
    #sidebar { width: 340px; overflow-y: auto; background: #151e2e; border-radius: 12px; padding: 12px; border: 1px solid #223049; }
    .channel-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid #1e293b; }
    .channel-item:hover { background: #223049; }
    .channel-logo-container { width: 44px; height: 44px; min-width: 44px; border-radius: 8px; background: rgba(255, 255, 255, 0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 3px; border: 1px solid #334155; }
    .channel-logo { width: 100%; height: 100%; object-fit: contain; }
    #player-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    video { width: 100%; height: 75vh; border-radius: 12px; background: #000; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h3 style="padding-bottom: 10px; margin: 0 0 10px 0; border-bottom: 2px solid #3b82f6;">پێڕستی کەناڵە کوردییەکان</h3>
    <div id="list">کەناڵەکان باردەکرێن...</div>
  </div>
  <div id="player-container">
    <h2 id="current-title" style="margin-top: 0;">کەناڵێک دیاری بکە</h2>
    <video id="video" controls autoplay></video>
  </div>

  <script>
    const video = document.getElementById('video');
    let hls = null;

    function playStream(url, name) {
      document.getElementById('current-title').innerText = name;
      if (hls) {
        hls.destroy();
      }

      if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            // ئەگەر ڕاستەوخۆ بلۆک بوو، لە ڕێگەی سێرڤەری پرۆکسی هەوڵدەداتەوە
            const proxyUrl = `/channels/stream-proxy?url=${encodeURIComponent(url)}`;
            hls.loadSource(proxyUrl);
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play();
      }
    }

    fetch('/channels')
      .then(r => r.json())
      .then(channels => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        channels.forEach((ch, idx) => {
          const div = document.createElement('div');
          div.className = 'channel-item';
          let logoUrl = ch.logo && ch.logo.trim() !== '' 
            ? `/channels/logo-proxy?url=${encodeURIComponent(ch.logo)}` 
            : 'https://cdn-icons-png.flaticon.com/512/777/777242.png';

          div.innerHTML = `
            <div class="channel-logo-container">
              <img class="channel-logo" src="${logoUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/777/777242.png';" />
            </div>
            <div><strong>${ch.name}</strong></div>
          `;
          div.onclick = () => playStream(ch.streamUrl, ch.name);
          list.appendChild(div);

          if (idx === 0) playStream(ch.streamUrl, ch.name);
        });
      });
  </script>
</body>
</html>
